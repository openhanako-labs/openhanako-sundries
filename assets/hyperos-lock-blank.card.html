<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锁屏通知样张</title>
<style>
body{margin:0;font-family:'MiSans','HarmonyOS Sans','PingFang SC','Microsoft YaHei',sans-serif;color:#fff}
.ph{max-width:400px;margin:0 auto;min-height:760px;padding:48px 18px 26px;box-sizing:border-box;background:linear-gradient(165deg,#101C3E 0%,#2E3F7A 46%,#7A4E8F 100%);position:relative;display:flex;flex-direction:column}
.lock{display:flex;justify-content:center;margin-bottom:10px}
.lock svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{text-align:center;font-size:10px;letter-spacing:.42em;color:rgba(255,255,255,.5);margin-bottom:2px}
.date{text-align:center;font-size:17px;font-weight:400;color:rgba(255,255,255,.92);letter-spacing:.04em}
.time{text-align:center;font-size:92px;font-weight:200;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 22px;text-shadow:0 4px 24px rgba(0,0,0,.28)}
.stack{display:flex;flex-direction:column;gap:10px}
.nt{background:rgba(255,255,255,.88);background-image:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.82));border-radius:24px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.10);color:#1A1A1A;opacity:0;transform:translateY(-26px) scale(.96);animation:in .55s cubic-bezier(.34,1.56,.64,1) forwards}
.nt:nth-child(1){animation-delay:.25s}
.nt:nth-child(2){animation-delay:.33s}
.nt:nth-child(3){animation-delay:.41s}
.nt:nth-child(4){animation-delay:.49s}
@keyframes in{to{opacity:1;transform:none}}
.ico{width:40px;height:40px;border-radius:26%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.tx{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.app{font-size:13px;font-weight:700;color:#3A3A3C}
.tm{font-size:11.5px;color:#8A8A8E;font-variant-numeric:tabular-nums}
.tt{font-size:14.5px;font-weight:700;color:#141416;margin-top:1px}
.bd{font-size:13px;color:#5C5C60;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glass{margin-top:auto;background:rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:14px 16px 12px;text-align:center}
.unlock{font-size:12.5px;color:rgba(255,255,255,.92);letter-spacing:.06em}
.chev{margin:5px auto 0;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.quick{display:flex;justify-content:space-between;margin-top:16px}
.qb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.home{width:120px;height:5px;border-radius:3px;background:rgba(255,255,255,.65);margin:18px auto 0}
.cr{font-size:10px;color:rgba(255,255,255,.55);text-align:center;margin-top:14px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="ph">
  <div class="lock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" role="img" title="锁"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="brand" id="title"></div>
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
  <div id="cbod" style="display:none;font-size:13px;line-height:1.6;color:rgba(255,255,255,.92);text-align:center;padding:0 8px;margin:0 0 22px;text-shadow:0 2px 8px rgba(0,0,0,.3)"></div>
  <div class="stack" id="stack">
    <div class="nt">
      <div class="ico" style="background:linear-gradient(135deg,#3B82F6,#8B5CF6)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="音符"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
      <div class="tx"><div class="hd"><span class="app" id="app0"></span><span class="tm" id="tm0"></span></div><div class="tt" id="tt0"></div><div class="bd" id="bd0"></div></div>
    </div>
    <div class="nt">
      <div class="ico" style="background:linear-gradient(135deg,#10B981,#34D399)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="对勾"><path d="M4 12l5 5L20 6"/></svg></div>
      <div class="tx"><div class="hd"><span class="app" id="app1"></span><span class="tm" id="tm1"></span></div><div class="tt" id="tt1"></div><div class="bd" id="bd1"></div></div>
    </div>
    <div class="nt">
      <div class="ico" style="background:linear-gradient(135deg,#F59E0B,#F97316)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="日历"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>
      <div class="tx"><div class="hd"><span class="app" id="app2"></span><span class="tm" id="tm2"></span></div><div class="tt" id="tt2"></div><div class="bd" id="bd2"></div></div>
    </div>
    <div class="nt">
      <div class="ico" style="background:linear-gradient(135deg,#EC4899,#8B5CF6)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="星标"><path d="M12 3l3 6 6 1-4.5 4.5L18 21l-6-3-6 3 1.5-6.5L3 10l6-1z"/></svg></div>
      <div class="tx"><div class="hd"><span class="app" id="app3"></span><span class="tm" id="tm3"></span></div><div class="tt" id="tt3"></div><div class="bd" id="bd3"></div></div>
    </div>
  </div>
  <div class="glass">
    <div class="unlock">向上滑动以解锁</div>
    <svg class="chev" width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="上滑"><path d="M2 8l7-6 7 6"/></svg>
  </div>
  <div class="quick">
    <div class="qb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="手电"><path d="M9 3h6v3l-1.5 2v11h-3V8L9 6z"/></svg></div>
    <div class="qb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" title="相机"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-2.5h4L15.5 7"/></svg></div>
  </div>
  <div class="home"></div>
  <div class="cr">风格指令 · phone-ui-demos · HyperOS 系统 UI 设计语言</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":420},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"顶部品牌/机型号"},"date":{"type":"string","description":"日期行"},"time":{"type":"string","description":"时钟（HH:MM）"},"items":{"type":"array","description":"锁屏通知条目，最多 4 条：[{app|label, time, title, body}]","maxItems":4,"items":{"type":"object","properties":{"app":{"type":"string"},"label":{"type":"string"},"time":{"type":"string"},"title":{"type":"string"},"body":{"type":"string"},"text":{"type":"string"}}}},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "锁屏通知",
  "date": "9月26日 星期六",
  "time": "09:41",
  "items": [
    {
      "app": "星轨音乐",
      "time": "现在",
      "title": "新单曲已上线",
      "body": "锁屏也是一张卡：时间、天气、还有一条提醒。"
    },
    {
      "app": "速记",
      "time": "09:38",
      "title": "风格样张已归档",
      "body": "锁屏也是一张卡：时间、天气、还有一条提醒。"
    },
    {
      "app": "日程",
      "time": "09:30",
      "title": "下一轮：深水区",
      "body": "锁屏也是一张卡：时间、天气、还有一条提醒。"
    }
  ],
  "body": "锁屏也是一张卡：时间、天气、还有一条提醒。"
}
</script>
<script>
(function(){
var D={title:'Lock Screen',date:'Sample date',time:'HH:MM',items:[{app:'Sample App',time:'now',title:'Sample title',body:'Sample body.'}]};
function str(v){if(v==null)return'';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(str).filter(Boolean).join(' ');return'';}
function pick(o,keys){if(!o||typeof o!=='object'||Array.isArray(o))return null;for(var i=0;i<keys.length;i++){var k=keys[i];if(Object.prototype.hasOwnProperty.call(o,k)&&str(o[k])!=='')return o[k];}return null;}
function put(id,v){var el=document.getElementById(id);if(el)el.textContent=str(v);}
function items(v,max){if(!Array.isArray(v))return null;var out=[];for(var i=0;i<v.length&&out.length<max;i++){var it=v[i];if(!it||typeof it!=='object'||Array.isArray(it))continue;var app=pick(it,['app','label','name','tag']),title=pick(it,['title','heading']),tm=pick(it,['time','when']),body=pick(it,['body','text','content','desc']);if(!str(app)&&!str(title)&&!str(tm)&&!str(body))continue;out.push({app:app,title:title,time:tm,body:body});}return out;}
var sEl=document.querySelector('script[data-card-state]');
var S=Object.assign({},D);
if(sEl){try{var u=JSON.parse(sEl.textContent);if(u&&typeof u==='object'&&!Array.isArray(u))for(var k in u)S[k]=u[k];}catch(e){}}
var L=items(pick(S,['items','list','rows']),4)||D.items;
put('title',pick(S,['title','heading']));
put('date',pick(S,['date','day']));
put('time',pick(S,['time','clock']));
var escF=function(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
var paras=(function(b){if(Array.isArray(b))return b.map(String).filter(Boolean);if(typeof b==='string')return b.split(/\n\s*\n/).map(function(t){return t.trim();}).filter(Boolean);return [];})(S.body);
var cbod=document.getElementById('cbod');
if(cbod){if(paras.length){cbod.innerHTML=paras.map(function(t){return '<p style="margin:0 0 .4em">'+escF(t)+'</p>';}).join('');cbod.style.display='';}else{cbod.style.display='none';cbod.innerHTML='';}}
for(var i=0;i<4;i++){
  var it=L[i];
  put('app'+i,it?it.app:'');
  put('tm'+i,it?it.time:'');
  put('tt'+i,it?it.title:'');
  put('bd'+i,it?it.body:'');
  var slot=document.getElementById(['app0','app1','app2','app3'][i]).closest('.nt');
  if(slot)slot.style.display=it?'':'none';
}
})();
</script>
</body>
</html>
