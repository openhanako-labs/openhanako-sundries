<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复古报纸头条样张</title>
<style>
body{margin:0;background:#EFE8D5;color:#2C2A26;font-family:'Playfair Display','Noto Serif SC','Songti SC',serif}
.w{max-width:640px;margin:0 auto;padding:52px 20px 26px}
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid #2C2A26;padding-bottom:8px;font-family:Consolas,'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:#5A554A}
.mast b{font-family:'Playfair Display',serif;font-size:1.25rem;letter-spacing:.04em;color:#2C2A26}
.head{display:flex;gap:20px;align-items:center;margin-top:22px}
.num{font-size:clamp(96px,22vw,150px);font-weight:900;line-height:.85;color:#2C2A26;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.num small{display:block;font-size:.16em;font-weight:700;letter-spacing:.3em;color:#B53929;margin-top:8px}
.hl h1{font-size:clamp(24px,5vw,34px);line-height:1.25;margin:0;font-weight:900}
.hl p{font-size:14px;line-height:1.8;margin:10px 0 0;color:#4A463E;text-align:justify}
.stamp{position:relative;margin-top:22px;display:inline-flex;align-items:center;gap:10px;border:2.5px solid #B53929;color:#B53929;border-radius:50%;width:86px;height:86px;justify-content:center;text-align:center;font-size:13px;font-weight:900;line-height:1.3;transform:rotate(-9deg);letter-spacing:.1em;opacity:.9}
.foot{display:flex;justify-content:space-between;border-top:1px solid #2C2A26;margin-top:20px;padding-top:8px;font-family:Consolas,monospace;font-size:10.5px;color:#5A554A;letter-spacing:.12em}
.cr{text-align:center;font-size:10px;color:#8A8474;margin-top:16px;letter-spacing:.1em;font-family:Consolas,monospace}
</style>
</head>
<body>
<div class="w">
  <div class="mast"><span>EST. 2026</span><b>The Style Times</b><span>VOL. 26</span></div>
  <div class="head">
    <div class="num">26<small>全 中</small></div>
    <div class="hl">
      <h1 id="h1"></h1>
      <p id="desc"></p>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
  <div class="foot"><span id="footDate"></span><span>STYLE HEADLINE 0-1</span></div>
  <div class="cr">风格指令 · video-shot-demos · 复古报纸头条（风格卡 0-1）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":640},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"头条标题，\n 分隔多行"},"subtitle":{"type":"string"},"desc":{"type":"string"},"stamp":{"type":"string","description":"印章文本，\n 分隔"},"date":{"type":"string"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "已发布",
  "desc": "结构化改造与可见文本验收同时完成。",
  "stamp": "审核\n通过",
  "date": "2026-09-26",
  "body": "结构化改造与可见文本验收同时完成。"
}
</script>
<script>
(function(){
  var DEFAULTS={title:'Sample Headline',subtitle:'副题',desc:'说明段落。',stamp:'审核\n通过',date:'2026-01-01'};
  function str(v){
    if(v==null) return '';
    if(typeof v==='string') return v;
    if(typeof v==='number'||typeof v==='boolean') return String(v);
    if(Array.isArray(v)) return v.map(str).filter(Boolean).join(' ');
    return '';
  }
  function put(id, v, allowHtml){
    var el=document.getElementById(id);
    if(!el) return;
    var s=str(v);
    if(!allowHtml || !/<[a-z]/i.test(s)) el.textContent=s;
    else el.innerHTML=s;
  }
  var sEl=document.querySelector('script[data-card-state]');
  var S=Object.assign({}, DEFAULTS);
  if(sEl){
    try{ var u=JSON.parse(sEl.textContent); if(u && typeof u==='object' && !Array.isArray(u)) for(var k in u) S[k]=u[k]; }catch(e){}
  }
  put('h1', str(S.title).split('\n').join('<br>'), true);
  put('desc', S.body||S.desc);
  put('stamp', str(S.stamp).split('\n').join('<br>'), true);
  put('footDate', S.date);
})();
</script>
</body>
</html>
