<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄铜天平学术对比样张</title>
<style>
body{margin:0;background:linear-gradient(180deg,#2a1f10,#1a1408);color:#f0e2bc;font-family:'Cormorant Garamond','Noto Serif SC','Songti SC',Georgia,serif}
.w{max-width:620px;margin:0 auto;padding:52px 20px 28px}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(232,195,106,.35);padding-bottom:8px;margin-bottom:6px}
.top .l{font-family:'Cormorant Garamond',Georgia,serif;font-size:13px;letter-spacing:.34em;color:#e8c36a;font-weight:700}
.top .r{font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.24em;color:#8a7550}
.title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:38px;line-height:1.1;letter-spacing:.02em;text-align:center;margin:6px 0 2px;color:#f0e2bc}
.title .zh{font-family:'Noto Serif SC','Songti SC',serif;font-weight:700;letter-spacing:.18em}
.sub{text-align:center;font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.32em;color:#c9a44c;margin-bottom:14px}
.svg-wrap{display:flex;justify-content:center;margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:6px}
.side{background:rgba(232,195,106,.06);border:1px solid rgba(232,195,106,.28);border-radius:4px;padding:12px 14px 12px}
.side h4{margin:0 0 6px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.04em;color:#e8c36a}
.side h4 .zh{font-family:'Noto Serif SC','Songti SC',serif;font-weight:700;margin-left:6px;color:#f0e2bc}
.side p{margin:0;font-size:13px;line-height:1.7;color:#e8d9b0}
.side ul{margin:8px 0 0;padding-left:14px;font-size:12.5px;line-height:1.7;color:#c9b58c}
.side ul li::marker{color:#c9a44c}
.sep{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;color:#8a7550;font-size:14px;letter-spacing:.14em;padding:0 4px}
.sep .eq{font-size:22px;color:#c9a44c;font-weight:700}
.foot{margin-top:14px;display:flex;justify-content:space-between;font-family:'Courier New',monospace;font-size:10.5px;color:#8a7550;letter-spacing:.2em;border-top:1px dashed rgba(232,195,106,.35);padding-top:8px}
.cr{text-align:center;font-size:10px;color:#6b5a3c;margin-top:12px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="w">
<div class="top"><span class="l">SCALE OF REASON</span><span class="r">1-1b · SC.26</span></div>
<div class="title"><span class="zh">学术之秤</span></div>
<div class="sub">A · B · COMPARE &amp; WEIGH</div>
<div class="svg-wrap">
<svg viewBox="0 0 380 130" width="380" height="130" aria-hidden="true">
<defs>
<linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8C6B2E"/>
<stop offset=".5" stop-color="#E8C36A"/>
<stop offset="1" stop-color="#8C6B2E"/>
</linearGradient>
</defs>
<path d="M190 24 L110 60 L270 60 Z" fill="url(#brass)" opacity=".55"/>
<rect x="185" y="18" width="10" height="86" fill="url(#brass)"/>
<rect x="90" y="98" width="200" height="8" fill="url(#brass)"/>
<line x1="100" y1="98" x2="100" y2="122" stroke="#8C6B2E" stroke-width="2"/>
<line x1="280" y1="98" x2="280" y2="122" stroke="#8C6B2E" stroke-width="2"/>
<path d="M60 60 L140 60 L130 92 L70 92 Z" fill="rgba(232,195,106,.22)" stroke="#c9a44c" stroke-width="1.5"/>
<path d="M240 60 L320 60 L310 92 L250 92 Z" fill="rgba(232,195,106,.22)" stroke="#c9a44c" stroke-width="1.5"/>
<circle cx="100" cy="60" r="4" fill="#E8C36A"/>
<circle cx="280" cy="60" r="4" fill="#E8C36A"/>
<circle cx="190" cy="18" r="6" fill="#E8C36A"/>
</svg>
</div>
<div class="cols">
<div class="side">
<h4>方法 A<span class="zh">实证</span></h4>
<p>可测量、可复现、可检验；代价是把「不可测」的部分推到窗外。</p>
<ul><li>样本大 · 结构清</li><li>易验证 · 易比较</li></ul>
</div>
<div class="sep"><span>A</span><span class="eq">⇄</span><span>B</span></div>
<div class="side">
<h4>方法 B<span class="zh">阐释</span></h4>
<p>能进入语义的褶皱；代价是要说清「为什么不是另一种解释」。</p>
<ul><li>深度足 · 语境全</li><li>难量化 · 难复述</li></ul>
</div>
</div>
<div class="foot"><span>BALANCE · 1-1b</span><span>两端都不轻，选择即是立场</span></div>
<div class="cr">风格指令 · video-shot-demos · 黄铜天平学术对比（风格卡 1-1b）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":620},"stateSchema":{"type":"object","properties":{"top_left":{"type":"string","description":"顶栏左英文"},"top_right":{"type":"string","description":"顶栏右编号"},"title":{"type":"string","description":"主标题"},"subtitle":{"type":"string","description":"副标题"},"left":{"type":"object","properties":{"name":{"type":"string","description":"A 侧名称"},"zh":{"type":"string","description":"A 侧中文"},"desc":{"type":"string","description":"A 侧描述"},"items":{"type":"array","items":{"type":"string","description":"A 侧要点"},"description":"A 侧要点"}}},"right":{"type":"object","properties":{"name":{"type":"string","description":"B 侧名称"},"zh":{"type":"string","description":"B 侧中文"},"desc":{"type":"string","description":"B 侧描述"},"items":{"type":"array","items":{"type":"string","description":"B 侧要点"},"description":"B 侧要点"}}},"foot_left":{"type":"string","description":"页脚左"},"foot_right":{"type":"string","description":"页脚右"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "top_left": "两端都不轻",
  "top_right": "两端都不轻",
  "title": "学术之秤",
  "subtitle": "把复杂留给自己，把清楚留给别人。",
  "left": {
    "name": "方法 A",
    "zh": "实证",
    "desc": "把复杂留给自己，把清楚留给别人。",
    "items": [
      "样本大 · 结构清",
      "易验证 · 易比较"
    ]
  },
  "right": {
    "name": "方法 B",
    "zh": "阐释",
    "desc": "把复杂留给自己，把清楚留给别人。",
    "items": [
      "深度足 · 语境全",
      "难量化 · 难复述"
    ]
  },
  "foot_left": "两端都不轻",
  "foot_right": "两端都不轻",
  "body": "把复杂留给自己，把清楚留给别人。"
}
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;
  }
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);if(S.body){if(S.title)S.title=S.title+'\n'+S.body;else S.title=S.body;}

if(S.top_left){var e1=document.querySelector(".top .l");if(e1)e1.textContent=s(S.top_left,e1.textContent);}
if(S.top_right){var e2=document.querySelector(".top .r");if(e2)e2.textContent=s(S.top_right,e2.textContent);}
if(S.title){var e3=document.querySelector(".title .zh");if(e3)e3.textContent=s(S.title,e3.textContent);}
if(S.subtitle){var e4=document.querySelector(".sub");if(e4)e4.textContent=s(S.subtitle,e4.textContent);}
var sides=document.querySelectorAll(".cols > .side");
var sideArr=[S.left,S.right];
for(var si=0;si<sides.length;si++){var sd=sideArr[si];if(!sd)continue;var se=sides[si];
  var h4=se.querySelector("h4");
  if(h4){var zhNodes=h4.querySelectorAll(".zh");var zh=zhNodes[0]||h4.appendChild(document.createElement("span"));
    if(zh.className==="zh"===false&&zh!==zhNodes[0]){h4.removeChild(zh);zh=zhNodes[0]||h4.appendChild(document.createElement("span"));zh.className="zh";}
    var name=s(sd.name||"");
    var zhTxt=s(sd.zh||"");
    // Rebuild h4 innerHTML: name text + <span class="zh">zh</span>
    h4.innerHTML=e(name)+(zhTxt?"<span class=\"zh\">"+e(zhTxt)+"</span>":"");
  }
  var p=se.querySelector("p");if(p)p.textContent=s(sd.desc||"");
  var ul=se.querySelector("ul");if(ul){var items=arr(sd.items||[],4);if(items.length>0)ul.innerHTML=items.map(function(x){return "<li>"+e(s(x,""))+"</li>";}).join("");}}
var fEls=document.querySelectorAll(".foot > span");
if(fEls[0]&&S.foot_left)fEls[0].textContent=s(S.foot_left,fEls[0].textContent);
if(fEls[1]&&S.foot_right)fEls[1].textContent=s(S.foot_right,fEls[1].textContent);
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
