<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美式漫画样张</title>
<style>
body{margin:0;background:#FFF3D6;color:#0A0A0A;font-family:'Bangers','Impact','Arial Black','ZCOOL KuaiLe',sans-serif}
.w{max-width:520px;margin:0 auto;padding:52px 20px 24px}
.panel{position:relative;background:#FFF3D6;border:4px solid #0A0A0A;padding:22px 22px 24px;box-shadow:10px 10px 0 rgba(0,0,0,.22);overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#111 1.6px,transparent 2px);background-size:10px 10px;opacity:.1;pointer-events:none}
.dots.r{background-image:radial-gradient(circle,#D62828 2px,transparent 2.4px);background-size:12px 12px;opacity:.32;background-position:14px 12px;-webkit-mask-image:linear-gradient(120deg,#000 45%,transparent 55%);mask-image:linear-gradient(120deg,#000 45%,transparent 55%)}
.tag{position:relative;background:#0A0A0A;color:#FFF3D6;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.32em;padding:5px 10px;display:inline-block;transform:rotate(-2deg);margin-bottom:6px;font-weight:700;z-index:3}
.kicker{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.28em;color:#D62828;margin:0 0 2px;font-weight:700;z-index:3;position:relative}
.bam{position:relative;margin:8px 0 12px;height:150px;z-index:3}
.bam .word{position:absolute;top:0;left:0;font-family:'Bangers','Impact','Arial Black',sans-serif;font-size:130px;color:#F7B801;letter-spacing:.02em;line-height:1;text-shadow:6px 6px 0 #0A0A0A;transform:rotate(-8deg);font-weight:900}
.bam .word .o{color:#D62828;text-shadow:6px 6px 0 #0A0A0A}
.bam .burst{position:absolute;top:-10px;left:-14px;width:520px;height:170px;z-index:1;pointer-events:none}
.bam .burst svg{width:100%;height:100%}
.bubble{position:absolute;bottom:16px;right:20px;background:#FFF;border:3px solid #0A0A0A;padding:8px 14px;font-family:'ZCOOL KuaiLe','YouYuan','Microsoft YaHei',sans-serif;font-size:15px;color:#0A0A0A;font-weight:900;border-radius:22px 22px 22px 4px;box-shadow:4px 4px 0 rgba(0,0,0,.22);transform:rotate(3deg);max-width:190px;z-index:4}
.bubble::after{content:"";position:absolute;bottom:-12px;left:16px;width:0;height:0;border:8px solid transparent;border-top-color:#0A0A0A;border-bottom:0}
.bubble::before{content:"";position:absolute;bottom:-8px;left:19px;width:0;height:0;border:6px solid transparent;border-top-color:#FFF;border-bottom:0;z-index:1}
.caps{background:#0A0A0A;color:#F7B801;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.28em;padding:6px 10px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center;z-index:3;position:relative}
.caps span{color:#FFF3D6;font-weight:700}
.line{background:#FFF;border:3.5px solid #0A0A0A;padding:12px 14px;font-size:14px;line-height:1.55;color:#0A0A0A;font-family:'ZCOOL KuaiLe','YouYuan','Microsoft YaHei',sans-serif;box-shadow:6px 6px 0 rgba(0,0,0,.2);margin:0 0 14px;z-index:3;position:relative;letter-spacing:.02em}
.line b{background:#F7B801;padding:1px 6px;color:#0A0A0A}
.actions{display:flex;gap:10px;margin-bottom:0;z-index:3;position:relative}
.btn{flex:1;background:#D62828;color:#FFF;border:3px solid #0A0A0A;padding:11px 14px;font-family:'Bangers','Impact','Arial Black',sans-serif;font-size:22px;letter-spacing:.06em;cursor:pointer;box-shadow:5px 5px 0 #0A0A0A;text-align:center;transition:.1s;font-weight:900}
.btn.y{background:#F7B801;color:#0A0A0A}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #0A0A0A}
.cr{font-family:'Courier New',monospace;font-size:10px;color:#7A6420;text-align:center;margin-top:14px;letter-spacing:.12em}
</style>
</head>
<body>
<div class="w">
  <div class="panel">
    <div class="dots"></div>
    <div class="dots r"></div>
    <div class="tag">PAGE 01 · ISSUE #41</div>
    <p class="kicker">AMERICAN COMIC · 2-3</p>
    <div class="bam">
      <div class="burst">
        <svg viewBox="0 0 520 170" preserveAspectRatio="none">
          <path d="M10 100 L60 30 L85 80 L130 20 L165 75 L220 15 L260 70 L310 25 L355 75 L410 20 L445 78 L490 40 L500 130 L440 155 L385 130 L340 165 L280 130 L230 168 L180 132 L125 160 L85 132 L35 158 Z" fill="#F7B801" stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="word">B<span class="o">A</span>M!</div>
      <div class="bubble">
        冲突<br>就在这里！
      </div>
    </div>
    <div class="caps"><span>STYLE VS REALITY</span><span>·</span><span>ROUND 1</span></div>
    <p class="line">粗黑描边 + 网点 + 拟声框——三件东西加起来，比一张信息图更能喊出「<b>爆点</b>」两个字。</p>
    <div class="actions">
      <button type="button" class="btn" data-action="action-a">PUNCH</button>
      <button type="button" class="btn y" data-action="action-b">DODGE</button>
    </div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 美式漫画（风格卡 18）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":520},"stateSchema":{"type":"object","properties":{"bubble":{"type":"string","description":"气泡台词"},"line":{"type":"string","description":"正文（HTML）"},"btns":{"type":"array","items":{"type":"string","description":"按钮文字"},"description":"动作按钮（2）"},"title":{"type":"string","description":"主标题（必填）"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "bubble": "冲突就在这里！",
  "line": "所以问题的根源不是工具，而是顺序。",
  "btns": [
    "PUNCH",
    "DODGE"
  ],
  "title": "comic",
  "body": "冲突就在这里！"
}
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;}
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);
    if(S.body){S.line=S.body;}
    if(S.title){var tagEl=document.querySelector(".tag");if(tagEl)tagEl.textContent=S.title;}

if(S.bubble){var e1=document.querySelector(".bubble");if(e1)e1.innerHTML=e(S.bubble,e1.innerHTML);}
if(S.line){var e2=document.querySelector(".line");if(e2)e2.innerHTML=e(S.line,e2.innerHTML);}
var btns=arr(S.btns||[],2);
var btnEls=document.querySelectorAll(".actions > .btn");
for(var i=0;i<btnEls.length;i++){var x=btns[i];if(!x)continue;var be=btnEls[i];var txt=s(x.text||x.label||"");be.textContent=txt;be.className="btn"+(i===1?" y":"");be.setAttribute("data-action","action-"+(i===0?"a":"b"));}
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
