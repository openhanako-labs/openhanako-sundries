<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫兰迪样张</title>
<style>
body{margin:0;background:#E9E4DC;color:#5A5248;font-family:Georgia,'Noto Serif SC','Songti SC',serif}
.w{max-width:600px;margin:0 auto;padding:52px 18px 24px}
.card{background:#E4DDD3;border:1px solid #C9BFB2;border-radius:4px;padding:30px 30px 26px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.34em;color:#A8988C;text-transform:uppercase}
.h{font-size:1.75rem;font-weight:400;letter-spacing:.1em;margin:16px 0 6px;color:#5A5248}
.rule{width:46px;height:1px;background:#B7A99B;margin:16px auto}
.sub{font-size:13px;font-style:italic;color:#8B8175;letter-spacing:.06em}
.sw{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.s i{display:block;width:44px;height:44px;border-radius:50%;border:1px solid rgba(90,82,72,.18)}
.s span{font-size:10px;font-family:Consolas,monospace;color:#8B8175;letter-spacing:.04em}
.body{font-size:13.5px;line-height:2;color:#6B6257;margin-top:22px;text-align:center;white-space:pre-line}
.ft{margin-top:20px;padding-top:14px;border-top:1px solid #C9BFB2;font-size:11px;letter-spacing:.22em;color:#A8988C}
.cr{font-size:10px;color:#AFA69A;text-align:center;margin-top:14px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="w">
  <div class="card">
    <div class="eyebrow">morandi · low saturation</div>
    <div class="h" id="title"></div>
    <div class="rule"></div>
    <div class="sub" id="subtitle"></div>
    <div class="sw">
      <div class="s"><i style="background:#B7908A"></i><span>#B7908A</span></div>
      <div class="s"><i style="background:#9BA88F"></i><span>#9BA88F</span></div>
      <div class="s"><i style="background:#A8988C"></i><span>#A8988C</span></div>
      <div class="s"><i style="background:#8B95A1"></i><span>#8B95A1</span></div>
    </div>
    <div class="body" id="note"></div>
    <div class="ft">STYLE SAMPLE 05</div>
  </div>
  <div class="cr">风格指令 · design-media · SVG 风格表 morandi</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":600},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"色卡主标题"},"subtitle":{"type":"string","description":"一句斜体说明"},"note":{"type":"string","description":"风格语气说明，\\n 分行"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "莫兰迪",
  "subtitle": "莫兰迪 · 低饱和才是耐看的",
  "note": "灰调不等于灰心。",
  "body": "灰调不等于灰心。"
}
</script>
<script>
(function(){
var D={title:'Sample Title',subtitle:'Sample subtitle',note:'Sample note.\nSecond line.'};
function str(v){if(v==null)return'';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(str).filter(Boolean).join(' ');return'';}
function pick(o){if(!o||typeof o!=='object'||Array.isArray(o))return null;var a=arguments;for(var i=1;i<a.length;i++){var k=a[i];if(Object.prototype.hasOwnProperty.call(o,k)&&str(o[k])!=='')return o[k];}return null;}
function put(id,v){var el=document.getElementById(id);if(el)el.textContent=str(v);}
var sEl=document.querySelector('script[data-card-state]');
var S=Object.assign({},D);
if(sEl){try{var u=JSON.parse(sEl.textContent);if(u&&typeof u==='object'&&!Array.isArray(u))for(var k in u)S[k]=u[k];}catch(e){}}
put('title',pick(S,'title','heading'));
put('subtitle',pick(S,'body','subtitle','desc'));
put('note',pick(S,'note','caption'));
})();
</script>
</body>
</html>
