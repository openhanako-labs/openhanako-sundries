<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地铁线路图样张</title>
<style>
body{margin:0;background:#F5F3EE;color:#1F1F1F;font-family:'Archivo','Helvetica Neue','Noto Sans SC',sans-serif}
.w{max-width:640px;margin:0 auto;padding:52px 14px 26px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.t{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.s{font-size:11px;color:#6E6E6E;letter-spacing:.18em}
.map{background:#FFFFFF;border:1px solid #E2DFD8;border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#4A4A4A}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:6px;border-radius:3px}
.cr{font-size:10px;color:#9A968E;text-align:center;margin-top:14px;letter-spacing:.12em}
</style>
</head>
<body>
<div class="w">
  <div class="hd"><div class="t" data-text>风格线网图</div><div class="s" data-text>STYLE METRO · L1–L3</div></div>
  <div class="map">
    <svg viewBox="0 0 600 300" role="img" title="三条风格线路与换乘站">
      <path d="M30 70 H570" stroke="#E4322C" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M30 210 H180 L240 150 H420 L480 210 H570" stroke="#0066B2" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M300 40 V260" stroke="#009B4C" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g fill="#FFFFFF" stroke-width="4">
        <circle cx="90" cy="70" r="7" stroke="#E4322C"/>
        <circle cx="170" cy="70" r="7" stroke="#E4322C"/>
        <circle cx="300" cy="70" r="10" stroke="#E4322C"/>
        <circle cx="430" cy="70" r="7" stroke="#E4322C"/>
        <circle cx="520" cy="70" r="7" stroke="#E4322C"/>
        <circle cx="90" cy="210" r="7" stroke="#0066B2"/>
        <circle cx="300" cy="150" r="10" stroke="#0066B2"/>
        <circle cx="520" cy="210" r="7" stroke="#0066B2"/>
        <circle cx="300" cy="90" r="7" stroke="#009B4C"/>
        <circle cx="300" cy="230" r="7" stroke="#009B4C"/>
      </g>
      <circle cx="300" cy="70" r="4.5" fill="#009B4C"/>
      <circle cx="300" cy="150" r="4.5" fill="#009B4C"/>
      <g font-family="Noto Sans SC, sans-serif" font-size="13" fill="#1F1F1F" text-anchor="middle" font-weight="600">
        <text x="90" y="52" data-station>image-gen</text>
        <text x="170" y="52" data-station>design-skills</text>
        <text x="300" y="36" fill="#E4322C" data-station>check-card ⇄</text>
        <text x="430" y="52" data-station>ppt-tools</text>
        <text x="520" y="52" data-station>house</text>
        <text x="90" y="240" data-station>scholar-a</text>
        <text x="300" y="176" fill="#0066B2" data-station>style-lib ⇄</text>
        <text x="520" y="240" data-station>scholar-b</text>
        <text x="300" y="284" fill="#009B4C" data-station>样张终点</text>
        <text x="300" y="110" fill="#009B4C" data-station>meta</text>
      </g>
      <g font-family="Archivo, sans-serif" font-size="15" font-weight="800">
        <rect x="36" y="86" width="26" height="26" rx="6" fill="#E4322C"/><text x="49" y="104" text-anchor="middle" fill="#fff">L1</text>
        <rect x="36" y="226" width="26" height="26" rx="6" fill="#0066B2"/><text x="49" y="244" text-anchor="middle" fill="#fff">L2</text>
        <rect x="316" y="40" width="26" height="26" rx="6" fill="#009B4C"/><text x="329" y="58" text-anchor="middle" fill="#fff">L3</text>
      </g>
    </svg>
  </div>
  <div class="legend">
    <span class="lg" data-line="0"><span class="sw" style="background:#E4322C"></span><span data-text>L1 样张主线</span></span>
    <span class="lg" data-line="1"><span class="sw" style="background:#0066B2"></span><span data-text>L2 风格环线</span></span>
    <span class="lg" data-line="2"><span class="sw" style="background:#009B4C"></span><span data-text>L3 验证纵线</span></span>
    <span class="lg" data-text>○ 换乘站 = 两线交汇</span>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 地铁线路图（风格卡 5-1）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":640},"stateSchema":{"type":"object","properties":{"title":{"type":"string"},"subtitle":{"type":"string"},"lines":{"type":"array","items":{"type":"object","properties":{"name":{"type":"string"}}}},"legendTail":{"type":"string"},"stations":{"type":"array","items":{"type":"string"}},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "风格线网图",
  "subtitle": "STYLE METRO · L1–L3",
  "lines": [
    {
      "name": "L1 样张主线"
    },
    {
      "name": "L2 风格环线"
    },
    {
      "name": "L3 验证纵线"
    }
  ],
  "legendTail": "○ 换乘站 = 两线交汇",
  "stations": [
    "image-gen",
    "STYLE METRO · L1–L3",
    "STYLE METRO · L1–L3",
    "ppt-tools",
    "house",
    "scholar-a",
    "STYLE METRO · L1–L3",
    "scholar-b",
    "样张终点",
    "meta"
  ],
  "body": "STYLE METRO · L1–L3"
}
</script>
<script>
(function(){
var MANIFEST={"spec":"1.0","display":{"preferredWidthPx":640},"stateSchema":{"type":"object","properties":{"title":{"type":"string"},"subtitle":{"type":"string"},"lines":{"type":"array"},"legendTail":{"type":"string"},"stations":{"type":"array"}}}};
var SAMPLE={"title":"风格线网图","subtitle":"STYLE METRO · L1–L3","lines":[{"name":"L1 样张主线"},{"name":"L2 风格环线"},{"name":"L3 验证纵线"}],"legendTail":"○ 换乘站 = 两线交汇","stations":["image-gen","design-skills","check-card ⇄","ppt-tools","house","scholar-a","style-lib ⇄","scholar-b","样张终点","meta"]};
var raw, S;
try{raw=document.querySelector('[data-card-state]');S=raw?JSON.parse(raw.textContent):{};}catch(e){S={}}
S=Object.assign({},SAMPLE,S);
var s=function(v,d){if(v===undefined||v===null)return d;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(function(x){return String(x);}).join('\n\n');return typeof v==='string'?v:d};
function put(sel,val,def){var e=document.querySelector(sel);if(e)e.textContent=s(val,def)}
put('.t',S.title,'');
put('.s',S.body||S.subtitle,'');
var lineLg=document.querySelectorAll('.legend span[data-line]');
var lines=Array.isArray(S.lines)?S.lines.slice(0,3):SAMPLE.lines;
for(var i=0;i<lineLg.length;i++){var it=lines[i];if(it&&typeof it==='object'){lineLg[i].querySelector('span[data-text]').textContent=s(it.name,'')}}
document.querySelector('.legend span.lg[data-text]').textContent=s(S.legendTail,'');
var stations=Array.isArray(S.stations)?S.stations.slice(0,10):SAMPLE.stations;
var stEls=document.querySelectorAll('text[data-station]');
for(var j=0;j<stEls.length;j++){stEls[j].textContent=s(stations[j],'')}
})();
</script>
</body>
</html>
