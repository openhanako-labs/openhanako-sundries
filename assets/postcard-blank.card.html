<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毕业寄语明信片样张</title>
<style>
body{margin:0;background:#e6dbc0;color:#3a2a18;font-family:'Ma Shan Zheng','Kaiti SC','KaiTi',cursive}
.w{max-width:600px;margin:0 auto;padding:52px 18px 28px}
.pcard{position:relative;background:#fdf8e8;border:1px solid #d5c9a8;border-radius:2px;padding:22px 22px 20px;box-shadow:6px 6px 0 rgba(0,0,0,.14),0 14px 30px rgba(0,0,0,.22);display:grid;grid-template-columns:1.05fr 1fr;gap:0;min-height:340px;overflow:hidden}
.paper{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(200,160,80,.06),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(200,160,80,.08),transparent 60%);pointer-events:none}
.left{position:relative;padding:6px 12px 6px 2px;font-family:'Ma Shan Zheng','KaiTi',cursive;color:#3a2a18;font-size:17px;line-height:1.85;z-index:2}
.left .from{font-family:'Courier New',monospace;font-size:10px;color:#8a7550;letter-spacing:.24em;margin-bottom:10px}
.left .salu{font-size:22px;margin-bottom:8px;color:#3a2a18}
.left p{margin:0 0 10px}
.left .sig{margin-top:14px;text-align:right;font-size:18px;color:#3a2a18;line-height:1.4}
.left .sig .date{font-family:'Courier New',monospace;font-size:10px;color:#8a7550;letter-spacing:.2em;margin-top:6px}
.mid{position:absolute;top:12px;bottom:12px;left:53.5%;width:0;border-left:2px dashed rgba(180,140,60,.55);z-index:1}
.right{position:relative;padding:6px 2px 6px 12px;z-index:2}
.stamp-box{position:absolute;top:12px;right:14px;width:62px;height:78px;background:linear-gradient(135deg,#c94a3a 0%,#a53828 100%);color:#fdf8e8;border:1px solid #7a2a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.35);padding:4px}
.stamp-box::before,.stamp-box::after{content:"";position:absolute;left:-4px;right:-4px;background:#fdf8e8;height:8px}
.stamp-box::before{top:-4px;background:radial-gradient(circle at 6px 4px,transparent 4px,#fdf8e8 4.5px) repeat-x;background-size:12px 8px}
.stamp-box::after{bottom:-4px;background:radial-gradient(circle at 6px 4px,transparent 4px,#fdf8e8 4.5px) repeat-x;background-size:12px 8px}
.stamp-inner{border:1.5px solid #fdf8e8;padding:6px 4px;text-align:center;font-family:'Courier New',monospace;font-size:9px;line-height:1.4;letter-spacing:.08em;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.stamp-inner .zh{font-family:'Ma Shan Zheng','KaiTi',cursive;font-size:14px;letter-spacing:.16em;color:#fff}
.stamp-inner .denom{color:#f4d890;font-weight:700;font-size:11px}
.stamp-inner svg{width:22px;height:22px}
.postmark{position:absolute;top:100px;right:36px;width:110px;height:110px;border:2px solid rgba(180,50,40,.6);border-radius:50%;color:rgba(180,50,40,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-16deg);font-family:'Courier New',monospace;font-size:9px;letter-spacing:.2em;line-height:1.4;text-align:center;padding:8px}
.postmark::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(180,50,40,.5);border-radius:50%}
.postmark .zh{font-family:'Ma Shan Zheng','KaiTi',cursive;font-size:20px;letter-spacing:.12em;margin:2px 0}
.right .to-line{margin-top:130px;padding-left:12px;font-family:'Courier New',monospace;font-size:10.5px;color:#7a6a4a;letter-spacing:.2em;line-height:1.9;border-left:1px solid rgba(180,140,60,.35)}
.right .to-line b{display:block;color:#3a2a18;font-family:'Ma Shan Zheng','KaiTi',cursive;font-size:16px;letter-spacing:.08em;margin-bottom:6px}
.right .to-line .row{border-bottom:1px solid rgba(180,140,60,.3);padding:3px 0}
.cr{text-align:center;font-size:10px;color:#7a6a4a;margin-top:12px;letter-spacing:.12em}
</style>
</head>
<body>
