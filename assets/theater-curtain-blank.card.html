<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧院帷幕样张</title>
<style>
body{margin:0;background:#3A0A12;color:#F3E3B8;font-family:'Cormorant Garamond','Noto Serif SC','Songti SC',serif}
.w{max-width:600px;margin:0 auto;padding:52px 16px 26px}
.valance{height:104px;background:repeating-linear-gradient(90deg,#6E1020 0 16px,#8E1828 26px,#6E1020 40px);border-bottom:4px solid #C9A24B;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.55);border-radius:0 0 6px 6px}
.valance::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;background:radial-gradient(circle at 12px 0,#C9A24B 0 7px,transparent 7.5px) 0 0/24px 16px repeat-x}
.curtain{background:repeating-linear-gradient(90deg,#5A0D19 0 18px,#7E1626 34px,#5A0D19 50px);padding:44px 24px 40px;text-align:center;box-shadow:inset 0 0 70px rgba(0,0,0,.55)}
.season{font-size:12px;letter-spacing:.5em;color:#C9A24B}
.t{font-size:clamp(34px,8vw,52px);font-weight:600;letter-spacing:.3em;margin:16px 0 6px;color:#F3E3B8;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0}
.rule i{width:80px;height:1px;background:linear-gradient(90deg,transparent,#C9A24B)}
.rule i:last-child{background:linear-gradient(90deg,#C9A24B,transparent)}
.rule s{width:9px;height:9px;background:#C9A24B;transform:rotate(45deg);text-decoration:none}
.sub{font-size:15.5px;font-style:italic;color:#E8D6A8;letter-spacing:.14em;line-height:1.9}
.tassels{display:flex;justify-content:center;gap:26px;margin-top:26px}
.tass{width:16px;height:34px;background:linear-gradient(180deg,#C9A24B,#8A6B2A);clip-path:polygon(0 0,100% 0,70% 100%,30% 100%)}
.cr{text-align:center;font-size:10px;color:#8A6B5A;margin-top:22px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="w">
  <div class="valance"></div>
  <div class="curtain">
    <div class="season">S T Y L E · S E A S O N</div>
    <div class="t">风 格 剧 院</div>
    <div class="rule"><i></i><s></s><i></i></div>
    <div class="sub">今晚剧目：三十幕风格轮演<br>第五幕 · 幕间休息已毕</div>
    <div class="tassels"><span class="tass"></span><span class="tass"></span><span class="tass"></span><span class="tass"></span><span class="tass"></span></div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 剧院帷幕（风格卡 0-5）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":600},"stateSchema":{"type":"object","properties":{"season":{"type":"string","description":"英文季节标"},"title":{"type":"string","description":"剧院标题"},"subtitle":{"type":"string","description":"剧目描述（HTML）"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "season": "第三幕",
  "title": "风 格 剧 院",
  "subtitle": "今晚演的是「删减」",
  "body": "今晚演的是「删减」"
}
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;
  }
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);if(S.body){if(S.title)S.title=S.title+'\n'+S.body;else S.title=S.body;}

if(S.season){var e1=document.querySelector(".season");if(e1)e1.textContent=s(S.season,e1.textContent);}
if(S.title){var e2=document.querySelector(".t");if(e2)e2.textContent=s(S.title,e2.textContent);}
if(S.subtitle){var e3=document.querySelector(".sub");if(e3)e3.innerHTML=e(S.subtitle,e3.innerHTML);}
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
