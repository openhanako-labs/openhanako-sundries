<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手账皮革本样张</title>
<style>
body{margin:0;background:#2B211A;font-family:'Roboto','Segoe UI',sans-serif;color:#EDE3CE}
.desk{max-width:560px;margin:0 auto;padding:52px 16px 24px;position:relative}
.cover{position:relative;background:#5A3A28;border-radius:12px;padding:22px 22px 22px 40px;box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.15);background-image:radial-gradient(circle at 30% 20%,rgba(255,200,140,.08),transparent 40%),radial-gradient(circle at 70% 80%,rgba(0,0,0,.25),transparent 45%)}
.rings{position:absolute;left:10px;top:26px;bottom:26px;display:flex;flex-direction:column;justify-content:space-around}
.ring{width:24px;height:24px;border-radius:50%;border:4px solid #B9954A;background:transparent;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,240,200,.5)}
.page{background:#F7F0DF;border-radius:4px;padding:20px 22px;color:#31291D;box-shadow:0 4px 12px rgba(0,0,0,.35);position:relative}
.ph{font-family:'Ma Shan Zheng','STKaiti','KaiTi',cursive;font-size:1.7rem;color:#31291D;margin-bottom:4px}
.ps{font-size:.78rem;color:#8A7A5E;letter-spacing:.14em;margin-bottom:14px;font-family:Consolas,monospace}
.row{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.6;margin-bottom:11px}
.row svg{flex:0 0 auto;margin-top:2px}
.tag{position:absolute;top:14px;right:16px;font-size:.68rem;color:#9D3A2A;border:1px solid #9D3A2A;border-radius:3px;padding:2px 7px;letter-spacing:.1em;transform:rotate(3deg)}
.cr{font-size:10px;color:rgba(237,227,206,.5);text-align:center;margin-top:14px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="desk">
  <div class="cover">
    <div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
    <div class="page">
      <div class="tag" data-text>手账</div>
      <div class="ph" data-text>皮革与金属环</div>
      <div class="ps" data-text>STYLE B — JOURNAL</div>
      <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9D3A2A" stroke-width="1.6" role="img"><title>锁</title><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-text>皮革封面吃光，金属环压边</span></div>
      <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A6B4A" stroke-width="1.6" role="img"><title>页</title><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/></svg><span data-text>毛笔标题，米黄内页，纸不越皮</span></div>
      <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D6CB6" stroke-width="1.6" role="img"><title>环</title><circle cx="12" cy="12" r="7"/><path d="M12 5v-2M12 21v-2M5 12H3M21 12h-2"/></svg><span data-text>图标走 Remix 线稿，禁 emoji</span></div>
    </div>
  </div>
  <div class="cr">风格指令 · scholar-notes · Style B 手账皮革本</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":560},"stateSchema":{"type":"object","properties":{"tag":{"type":"string"},"title":{"type":"string"},"subtitle":{"type":"string"},"items":{"type":"array","items":{"type":"object","properties":{"text":{"type":"string"}}}},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "tag": "手账",
  "title": "皮革与金属环",
  "subtitle": "JOURNAL · 十月",
  "items": [
    {
      "text": "JOURNAL · 十月"
    },
    {
      "text": "JOURNAL · 十月"

    {
      "text": "JOURNAL · 十月"

  "body": "JOURNAL · 十月"

</script>
<script>
(function(){
var MANIFEST={"spec":"1.0","display":{"preferredWidthPx":560},"stateSchema":{"type":"object","properties":{"tag":{"type":"string"},"title":{"type":"string"},"subtitle":{"type":"string"},"items":{"type":"array","items":{"type":"object","properties":{"text":{"type":"string"}}}}}}}
var SAMPLE={"tag":"手账","title":"皮革与金属环","subtitle":"STYLE B — JOURNAL","items":[{"text":"皮革封面吃光，金属环压边"},{"text":"毛笔标题，米黄内页，纸不越皮"},{"text":"图标走 Remix 线稿，禁 emoji"}]};
var raw, S;
try{raw=document.querySelector('[data-card-state]');S=raw?JSON.parse(raw.textContent):{};}catch(e){S={}}
S=Object.assign({},SAMPLE,S);
var MAX_ITEMS=6;
var s=function(v,d){if(v===undefined||v===null)return d;if(typeof v==='number'||typeof v==='boolean')return String(v);return typeof v==='string'?v:d};
var arr=function(v){return Array.isArray(v)?v:[]};
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function txt(t){var e=document.querySelector(t);if(e)e.textContent=s(null,'')}
function txtV(t,v){var e=document.querySelector(t);if(e)e.textContent=v}
txtV('[data-text].tag',s(S.tag,'便签'));
txtV('.ph[data-text]',s(S.title,'标题'));
txtV('.ps[data-text]',s(S.subtitle,'子标题'));
var list=arr(S.items).slice(0,MAX_ITEMS).filter(function(o){return o&&typeof o==='object'});
var rows=document.querySelectorAll('.row');
for(var i=0;i<rows.length;i++){
  var it=list[i];
  var sp=rows[i].querySelector('span[data-text]');
  if(sp){
    if(it){var raw_txt=it.text!==undefined?it.text:(it.body!==undefined?it.body:(it.content!==undefined?it.content:undefined));sp.textContent=s(raw_txt,'');}
    else{sp.textContent='';}
  }
}
var _esc=function(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
var _pg=document.querySelector('.page');
if(_pg){
  var _raw=S.body,_ps=[];
  if(Array.isArray(_raw))_ps=_raw.map(String).filter(Boolean);
  else if(typeof _raw==='string')_ps=_raw.split(/\n\s*\n/).map(function(t){return t.trim();}).filter(Boolean);
  if(_ps.length){
    var _d=document.createElement('div');
    _d.style.cssText='font-size:14px;line-height:1.8;color:#31291D;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(49,41,29,.22)';
    _d.innerHTML=_ps.map(function(t){return '<p style="margin:0 0 6px">'+_esc(t)+'</p>';}).join('');
    _pg.appendChild(_d);
  }
}
})();
</script>
</body>
</html>
