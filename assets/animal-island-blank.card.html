<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日小事</title>
<style>
body{margin:0;font-family:'Nunito','Segoe UI Rounded','Yu Gothic UI','Microsoft YaHei UI',sans-serif;background:#f8f8f0;color:#794f27}
.panel{max-width:420px;margin:0 auto;padding:48px 16px 20px}
.card{background:#ffffff;border-radius:24px;padding:20px;box-shadow:0 6px 0 #bdaea0}
.h{font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.sub{font-size:.75rem;color:#a58e6f;margin-top:3px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:12px;background:#f8f8f0;border-radius:50px;padding:11px 16px;margin-bottom:12px;cursor:pointer;box-shadow:0 5px 0 #bdaea0;transition:transform .18s cubic-bezier(0.4,0,0.2,1),box-shadow .18s cubic-bezier(0.4,0,0.2,1);border:none;width:100%;font:inherit;color:inherit;text-align:left}
.item:hover{transform:translateY(-2px);box-shadow:0 7px 0 #bdaea0}
.item:active{transform:translateY(2px);box-shadow:0 3px 0 #bdaea0}
.item:focus-visible{outline:3px solid #ffcc00;outline-offset:2px}
.check{flex:0 0 auto;width:24px;height:24px;border-radius:50px;background:#ffffff;box-shadow:inset 0 -2px 0 #e4dccd;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:transparent;transition:.18s cubic-bezier(0.4,0,0.2,1)}
.item[aria-pressed=true] .check{background:#19c8b9;color:#ffffff;box-shadow:inset 0 -2px 0 #0f9e90}
.item[aria-pressed=true] .label{opacity:.55;text-decoration:line-through}
.label{font-size:.92rem;font-weight:700;transition:.18s}
.go{margin-top:6px;width:100%;border:none;border-radius:50px;background:#19c8b9;color:#fff;font:inherit;font-weight:800;font-size:.95rem;padding:13px 0;cursor:pointer;box-shadow:0 5px 0 #0f9e90;transition:transform .18s cubic-bezier(0.4,0,0.2,1),box-shadow .18s cubic-bezier(0.4,0,0.2,1)}
.go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0f9e90}
.go:active{transform:translateY(2px);box-shadow:0 3px 0 #0f9e90}
.go:focus-visible{outline:3px solid #ffcc00;outline-offset:2px}
.count{font-size:.72rem;color:#a58e6f;text-align:center;margin-top:14px;font-weight:700;letter-spacing:.06em}
.credit{font-size:10px;color:#c4b49b;text-align:center;margin-top:10px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="panel">
  <div class="card">
    <div class="h">今日小事</div>
    <div class="sub">圆 pill · 底厚阴影 · hover 上浮 active 下压</div>
    <div id="cbod" style="display:none;font-size:.75rem;color:#a58e6f;margin-top:-2px;margin-bottom:16px;line-height:1.7"></div>
    <button type="button" class="item" aria-pressed="false" data-action="toggle-item" data-key="0"><span class="check">✓</span><span class="label">给阳台的花浇水</span></button>
    <button type="button" class="item" aria-pressed="false" data-action="toggle-item" data-key="1"><span class="check">✓</span><span class="label">散步 20 分钟</span></button>
    <button type="button" class="item" aria-pressed="false" data-action="toggle-item" data-key="2"><span class="check">✓</span><span class="label">读十页书再睡</span></button>
    <button type="button" class="go" data-action="check-all">全部打卡</button>
    <div class="count" id="count">今天 0 / 3</div>
  </div>
  <div class="credit">风格指令 · design-skills · Animal Island UI 七条铁律</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":456},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"卡片标题"},"subtitle":{"type":"string","description":"卡片副题"},"items":{"type":"array","items":{"type":"object","properties":{"text":{"type":"string","description":"任务文本"},"checked":{"type":"string","description":"true 表示已勾选"}}},"description":"今日任务（≤10）"},"go":{"type":"string","description":"全勾选按钮文字"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "今日小事",
  "subtitle": "今日小事 · 做完三件就收工",
  "items": [
    {
      "text": "给阳台的花浇水"
    },
    {
      "text": "散步 20 分钟"
    },
    {
      "text": "读十页书再睡"
    }
  ],
  "go": "全部打卡",
  "body": "今日小事 · 做完三件就收工"
}
</script>
<script>
(function(){
var items=Array.prototype.slice.call(document.querySelectorAll(".item"));
var count=document.getElementById("count");
function tally(){
 var n=items.filter(function(b){return b.getAttribute("aria-pressed")==="true";}).length;
 count.textContent="今天 "+n+" / "+items.length;
}
items.forEach(function(b){
 b.addEventListener("click",function(){
  b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true");
  tally();
 });
});
document.querySelector(".go").addEventListener("click",function(){
 var all=items.every(function(b){return b.getAttribute("aria-pressed")==="true";});
 items.forEach(function(b){b.setAttribute("aria-pressed",all?"false":"true");});
 tally();
});
tally();
})();
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;}
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);
    var paras=(function(b){if(Array.isArray(b))return b.map(String).filter(Boolean);if(typeof b==='string')return b.split(/\n\s*\n/).map(function(t){return t.trim();}).filter(Boolean);return [];})(S.body);
    var bb=document.getElementById('cbod');
    if(paras.length&&bb){bb.innerHTML=paras.map(function(t){return '<p style="margin:0 0 .35em">'+e(t,'')+'</p>';}).join('');bb.style.display='';}else if(bb){bb.style.display='none';bb.innerHTML='';}
    if(S.title){var e1=document.querySelector(".h");if(e1)e1.textContent=s(S.title,e1.textContent);}
    if(S.subtitle){var e2=document.querySelector(".sub");if(e2)e2.textContent=s(S.subtitle,e2.textContent);}
    var it=arr(S.items||S.list||S.rows,10);
    var btns=document.querySelectorAll(".card > .item:not(.go)");
    for(var i=0;i<btns.length;i++){var x=it[i];var b=btns[i];if(!b||!x)continue;var lbl=b.querySelector(".label");if(lbl)lbl.textContent=s(x.text||x.body||x.label||"");if(x.checked===true){b.setAttribute("aria-pressed","true");}else{b.setAttribute("aria-pressed","false");}}
    if(S.go){var gb=document.querySelector(".go");if(gb)gb.textContent=s(S.go,gb.textContent);}
  }catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
