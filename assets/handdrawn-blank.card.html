<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手绘草稿样张</title>
<style>
body{margin:0;background:#FBF8F1;color:#3A3A3A;font-family:'Kalam','Patrick Hand','Kaiti SC','KaiTi',cursive}
.w{max-width:560px;margin:0 auto;padding:52px 16px 24px}
.card{background:#FFFDF6;border:2.5px solid #3A3A3A;border-radius:225px 15px 235px 15px/15px 235px 15px 225px;padding:24px 26px;transform:rotate(-.5deg);box-shadow:3px 4px 0 rgba(58,58,58,.16)}
.h{font-size:1.6rem;font-weight:700;display:inline-block;position:relative}
.h svg{position:absolute;left:0;bottom:-9px;width:100%;height:9px}
.tag{display:inline-block;font-size:.78rem;border:2px dashed #7A7A7A;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:3px 12px;margin-top:16px;transform:rotate(1.2deg)}
.note{margin-top:16px;background:#FFF3A6;border:2px solid #3A3A3A;border-radius:225px 15px 235px 15px/15px 235px 15px 225px;padding:13px 16px;font-size:.95rem;line-height:1.7;transform:rotate(1.6deg);box-shadow:3px 4px 0 rgba(58,58,58,.14)}
.note b{background:linear-gradient(transparent 55%,rgba(255,120,110,.55) 55%);padding:0 3px;border-radius:3px}
.list{margin-top:18px;font-size:.98rem;line-height:2.1}
.list div{display:flex;gap:10px;align-items:center}
.circle{display:inline-block;padding:0 9px;border:2.5px solid #C0392B;border-radius:60%/50%;transform:rotate(-3deg);color:#C0392B;font-weight:700}
.arrow{color:#2D6CB6;font-weight:700}
.cr{font-size:11px;color:#9A9184;text-align:center;margin-top:16px;transform:rotate(-.6deg)}
</style>
</head>
<body>
<div class="w">
  <div class="card">
    <div class="h"><span id="title"></span><svg viewBox="0 0 200 9" preserveAspectRatio="none"><path d="M2 6 Q 30 1 60 5 T 120 4 T 198 5" fill="none" stroke="#2D6CB6" stroke-width="2.4" stroke-linecap="round"/></svg></div>
    <div class="tag" id="subtitle"></div>
    <div id="cbod" style="display:none;margin-top:12px;font-size:.92rem;line-height:1.65;color:#3A3A3A;background:#FFFDF6;border:2px dashed #7A7A7A;border-radius:225px 15px 235px 15px/15px 235px 15px 225px;padding:10px 14px;transform:rotate(-.4deg)"></div>
    <div class="note" id="note"></div>
    <div class="list">
      <div><span class="circle">圈</span><span>重点词用红笔圈出来</span></div>
      <div><span class="arrow">→</span><span>箭头手画，不走直线</span></div>
      <div><span style="background:linear-gradient(transparent 55%,rgba(255,234,120,.7) 55%);padding:0 3px">荧光笔</span><span> 扫过的字最亮</span></div>
    </div>
  </div>
  <div class="cr">风格指令 · design-media · SVG 风格表 handdrawn</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":560},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"色卡主标题"},"subtitle":{"type":"string","description":"标签"},"note":{"type":"string","description":"马克笔便签内容"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "手绘草稿风",
  "subtitle": "手绘涂鸦 · 允许不完美",
  "note": "线条歪一点，反而更像人画的。",
  "body": "线条歪一点，反而更像人画的。"
}
</script>
<script>
(function(){
var D={title:'Sample Title',subtitle:'Sample tag',note:'Sample note.'};
function str(v){if(v==null)return'';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(str).filter(Boolean).join(' ');return'';}
function pick(o){if(!o||typeof o!=='object'||Array.isArray(o))return null;var a=arguments;for(var i=1;i<a.length;i++){var k=a[i];if(Object.prototype.hasOwnProperty.call(o,k)&&str(o[k])!=='')return o[k];}return null;}
function put(id,v){var el=document.getElementById(id);if(el)el.textContent=str(v);}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var sEl=document.querySelector('script[data-card-state]');
var S=Object.assign({},D);
if(sEl){try{var u=JSON.parse(sEl.textContent);if(u&&typeof u==='object'&&!Array.isArray(u))for(var k in u)S[k]=u[k];}catch(e){}}
put('title',pick(S,'title','heading'));
put('subtitle',pick(S,'subtitle','desc'));
put('note',pick(S,'note','caption'));
var paras=(function(b){if(Array.isArray(b))return b.map(String).filter(Boolean);if(typeof b==='string')return b.split(/\n\s*\n/).map(function(t){return t.trim();}).filter(Boolean);return [];})(S.body);
var bb=document.getElementById('cbod');
if(bb){if(paras.length){bb.innerHTML=paras.map(function(t){return '<p style="margin:0 0 .4em">'+esc(t)+'</p>';}).join('');bb.style.display='';}else{bb.style.display='none';bb.innerHTML='';}}
})();
</script>
</body>
</html>
