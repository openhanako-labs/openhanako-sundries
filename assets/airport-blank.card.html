<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机场安检样张</title>
<style>
  :root{--airport:#0F4C8C;--airport-d:#0A3A6E;--airport-l:#1a5da8;--floor:#C8CBD2;--ink:#0F4C8C;--warn:#FFCC00}
  *{box-sizing:border-box}
  body{margin:0;background:#E4E6EB;color:var(--ink);font-family:'Archivo','Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .w{max-width:500px;margin:0 auto;padding:48px 18px 26px;position:relative}
  .card{position:relative;background:linear-gradient(180deg,#E4E6EB 0%,#DCDFE6 55%,#C8CBD2 100%);border:2px solid var(--airport);border-radius:4px;padding:18px 18px 20px;box-shadow:8px 8px 0 rgba(15,76,140,.18)}

  /* 顶部通道标识 */
  .hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--airport)}
  .hdr .id{font-size:12px;font-weight:800;letter-spacing:5px;color:var(--airport)}
  .hdr .id b{display:inline-block;padding:2px 8px;background:var(--airport);color:#fff;font-size:11px;letter-spacing:3px;margin-right:6px}
  .hdr .no{font-family:'IBM Plex Mono','Consolas',monospace;font-size:11px;letter-spacing:2px;color:var(--airport-d)}

  /* 主通道大蓝牌 */
  .sign{margin-top:18px;background:var(--airport);color:#fff;padding:22px 20px 22px;position:relative;box-shadow:6px 6px 0 rgba(15,76,140,.22)}
  .sign .en{font-size:11px;letter-spacing:5px;opacity:.75;font-weight:700;margin-bottom:6px}
  .sign h1{margin:0;font-size:34px;line-height:1.02;font-weight:900;letter-spacing:1px}
  .sign h1 .ar{display:inline-block;margin-left:12px;transform:translateY(-2px)}
  .sign .rule{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2.5px;color:rgba(255,255,255,.88);display:flex;justify-content:space-between}

  /* 传送带 */
  .belt{margin-top:16px;height:52px;background:repeating-linear-gradient(45deg,#5a6472 0 12px,#3a4250 12px 24px);border:2px solid var(--airport-d);position:relative;overflow:hidden;box-shadow:inset 0 0 22px rgba(0,0,0,.4)}
  .belt::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#FFCC00,#FFB703 40%,#FFCC00 60%,#FFB700)}
  .belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#FFCC00,#FFB700 40%,#FFCC00 60%,#FFB700)}
  .belt .box{position:absolute;left:14%;top:6px;right:auto;bottom:6px;background:var(--warn);border:2px solid #1a1a1a;box-shadow:3px 3px 0 rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:10px;font-weight:900;letter-spacing:2px}
  .belt .box.b2{left:52%;top:9px;height:22px;width:78px;background:#fff}
  .belt .box.b3{left:78%;top:5px;height:26px;width:44px;background:#8a94a0}

  /* 三条通道 */
  .lanes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
  .lane{background:#fff;border:2px solid var(--airport);padding:10px 8px;text-align:center;position:relative}
  .lane.deny{border-color:#B23A2A;background:#FDECE8}
  .lane .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:900;color:var(--airport);line-height:1}
  .lane.deny .num{color:#B23A2A}
  .lane .tag{font-size:10.5px;letter-spacing:2px;font-weight:700;color:var(--airport);margin-top:4px}
  .lane.deny .tag{color:#B23A2A}
  .lane .st{margin-top:6px;padding:2px 4px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.5px;background:var(--airport);color:#fff;display:inline-block}
  .lane.deny .st{background:#B23A2A}

  .note{margin-top:14px;font-size:12px;line-height:1.7;color:#1a3358;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px}
  .note b{color:#B23A2A}

  .cr{margin-top:16px;padding-top:10px;border-top:1px solid #9AA0AC;font-size:10px;letter-spacing:1.5px;color:#4a5261;font-family:'IBM Plex Mono',monospace;text-align:left}
</style>
</head>
<body>
<div class="w">
  <div class="card">
    <div class="hdr">
      <div class="id"><b>SEC</b> SECURITY LANE</div>
      <div class="no">GATE 04 / A-B-C</div>
    </div>
    <div class="sign">
      <div class="en">BOARDING · KEEP RIGHT · DO NOT BLOCK</div>
      <h1>
        请依次安检
        <span class="ar">
          <svg width="46" height="26" viewBox="0 0 46 26" fill="none" aria-hidden="true">
            <path d="M2 13 H36 M26 4 L38 13 L26 22" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </h1>
      <div class="rule"><span>KEEP LUGGAGE SEPARATE</span><span>01 : 23 : 47</span></div>
    </div>
    <div class="belt">
      <div class="box">A-0314</div>
      <div class="box b2">B-0472</div>
      <div class="box b3">C</div>
    </div>
    <div id="__L05_lanes__" class="lanes">
      <div class="lane"><div class="num">01</div><div class="tag">A · 常规</div><span class="st">CLEAR</span></div>
      <div class="lane"><div class="num">02</div><div class="tag">B · 抽检</div><span class="st">WAITING</span></div>
      <div class="lane deny"><div class="num">03</div><div class="tag">C · 拒收</div><span class="st">DENY</span></div>
    </div>
    <div class="note">通道规则：包与人分离 · 液体 ≤ 100ml · 锂电池随人携带。<br><b>违规即转 C 通道，本条不可撤销。</b></div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 机场安检（风格卡 2-11）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":500},"stateSchema":{"type":"object","properties":{"badge":{"type":"string","description":"通道徽标"},"lane_id":{"type":"string","description":"通道英文标识"},"gate":{"type":"string","description":"闸口编号"},"sign_en":{"type":"string","description":"英文指示"},"sign_title":{"type":"string","description":"主标语"},"rule_left":{"type":"string","description":"规则说明左"},"rule_time":{"type":"string","description":"倒计时间"},"belt":{"type":"array","items":{"type":"string","description":"箱子编码"},"description":"传送带箱子（1-3）"},"lanes":{"type":"array","items":{"type":"object","properties":{"num":{"type":"string","description":"编号"},"tag":{"type":"string","description":"通道名"},"status":{"type":"string","description":"状态标签"},"deny":{"type":"string","description":"true 表示拒绝通道"}}},"description":"安检通道（3）"},"note":{"type":"string","description":"规则说明（HTML）"},"title":{"type":"string","description":"主标题（必填）"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "badge": "SEC",
  "lane_id": "A-0314",
  "gate": "请依次安检",
  "sign_en": "SECURITY CHECK",
  "sign_title": "请依次安检",
  "rule_left": "随身液体 ≤ 100ml",
  "rule_time": "每件单独过机",
  "belt": [
    "A-0314",
    "B-0472",
    "C"
  ],
  "lanes": [
    {
      "num": "01",
      "tag": "A · 常规",
      "status": "CLEAR"
    },
    {
      "num": "02",
      "tag": "B · 抽检",
      "status": "WAITING"
    },
    {
      "num": "03",
      "tag": "C · 拒收",
      "status": "DENY",
      "deny": "true"
    }
  ],
  "note": "liquids · batteries · laptops",
  "title": "airport",
  "body": "请依次安检"
}
</script>



<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;}
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);
    if(S.title){S.sign_title=S.title;}
    if(S.body){S.note=S.body;}

if(S.badge){var b=document.querySelector(".hdr .id b");if(b)b.textContent=s(S.badge,b.textContent);}
if(S.lane_id){var lid=document.querySelector(".hdr .id span");if(!lid){var p=document.querySelector(".hdr .id");if(p){var txtNodes=[].slice.call(p.childNodes).filter(function(n){return n.nodeType===3;});if(txtNodes.length>1)txtNodes[1].nodeValue=S.lane_id;}}}
if(S.gate){var g=document.querySelector(".hdr .no");if(g)g.textContent=s(S.gate,g.textContent);}
if(S.sign_en){var en=document.querySelector(".sign .en");if(en)en.textContent=s(S.sign_en,en.textContent);}
if(S.sign_title){var ht=document.querySelector(".sign h1");if(ht){var txtNodes=[].slice.call(ht.childNodes).filter(function(n){return n.nodeType===3;});if(txtNodes[0])txtNodes[0].nodeValue=S.sign_title;}}
if(S.rule_left){var rl=document.querySelectorAll(".sign .rule span");if(rl[0])rl[0].textContent=s(S.rule_left,rl[0].textContent);}
if(S.rule_time){var rl=document.querySelectorAll(".sign .rule span");if(rl[1])rl[1].textContent=s(S.rule_time,rl[1].textContent);}
var belt=arr(S.belt||[],3);
var beltEls=document.querySelectorAll(".belt .box");
for(var i=0;i<3;i++){var be=beltEls[i];var bv=belt[i];if(!be||!bv)continue;be.textContent=s(bv.text||bv.label||"");}
var lanes=arr(S.lanes||[],3);
var laneEls=document.querySelectorAll("#__L05_lanes__ > .lane");
for(var li=0;li<3;li++){var le=laneEls[li];var xx=lanes[li];if(!le||!xx)continue;var num=le.querySelector(".num");var tag=le.querySelector(".tag");var st=le.querySelector(".st");if(num)num.textContent=s(xx.num||"");if(tag)tag.textContent=s(xx.tag||"");if(st)st.textContent=s(xx.status||"");if(xx.deny==="true"||xx.deny===true){le.classList.add("deny");}else{le.classList.remove("deny");}}
if(S.note){var note=document.querySelector(".note");if(note)note.innerHTML=e(S.note,note.innerHTML);}
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
