<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖色报纸样张</title>
<style>
body{margin:0;background:#E8DFC9;color:#211C14;font-family:Georgia,'Noto Serif SC','Songti SC',serif}
.n{max-width:660px;margin:0 auto;padding:52px 22px 24px;background:#F6F0E0;min-height:430px;box-shadow:0 10px 26px rgba(60,45,20,.2)}
.mast{text-align:center;border-bottom:3px double #211C14;padding-bottom:10px}
.mast h1{font-size:1.9rem;margin:0;letter-spacing:.14em;font-weight:900}
.ed{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;margin-top:7px;color:#5C5342;font-family:'Courier New',monospace}
.hl{display:flex;gap:16px;margin-top:18px}
.k{writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;color:#211C14;border-left:3px solid #211C14;padding-left:7px;font-weight:700;flex:0 0 auto}
.h2{font-size:1.45rem;margin:0;line-height:1.4;font-weight:900}
.sm{font-size:12.5px;color:#5C5342;margin-top:6px;font-style:italic}
.cols{column-count:2;column-gap:24px;column-rule:1px solid #C9BFA6;font-size:13.5px;line-height:1.85;margin-top:16px;text-align:justify}
.cols p{margin:0 0 11px;text-indent:2em}
.cols p:first-child::first-letter{font-size:2.6em;float:left;line-height:.9;padding:3px 8px 0 0;font-weight:900}
.ft{margin-top:18px;border-top:1px solid #211C14;padding-top:8px;font-size:11px;display:flex;justify-content:space-between;color:#5C5342;font-family:'Courier New',monospace}
.cr{font-size:10px;color:#8B8171;text-align:center;margin-top:12px;letter-spacing:.1em;font-family:'Courier New',monospace}
</style>
</head>
<body>
<div class="n">
  <div class="mast">
    <h1 id="h1"></h1>
    <div class="ed"><span id="edTag"></span><span id="edDate"></span></div>
  </div>
  <div class="hl">
    <div class="k" id="kicker"></div>
    <div>
      <div class="h2" id="h2"></div>
      <div class="sm" id="sm"></div>
    </div>
  </div>
  <div class="cols" id="cols"></div>
  <div class="ft"><span>P.01</span><span>THEME · WARM-PAPER</span></div>
  <div class="cr">风格指令 · ppt-animation · 暖色报纸主题</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":660},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"报头主标"},"edition":{"type":"string"},"date":{"type":"string"},"kicker":{"type":"string"},"headline":{"type":"string"},"subtitle":{"type":"string"},"columns":{"type":"array","items":{"type":"string"},"description":"两栏正文，\n 分段"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "风格样张日报",
  "edition": "STYLE LIB · 十月四日",
  "date": "2026 / 10 / 04",
  "kicker": "套色：米白纸",
  "headline": "七十张空壳的接线",
  "subtitle": "从样张到可用模板，中间差了七十六处改动",
  "columns": [
    "从样张到可用模板，中间差了七十六处改动",
    "从样张到可用模板，中间差了七十六处改动"
  ],
  "body": "从样张到可用模板，中间差了七十六处改动"
}
</script>
<script>
(function(){
  var DEFAULTS={title:'日报',edition:'EDITION',date:'01 / 01 / 2026',kicker:'竖排栏标',headline:'样张标题',subtitle:'副题',columns:['正文段落一。','正文段落二。'],body:''};
  function str(v){
    if(v==null) return '';
    if(typeof v==='string') return v;
    if(typeof v==='number'||typeof v==='boolean') return String(v);
    if(Array.isArray(v)) return v.map(str).filter(Boolean).join(' ');
    return '';
  }
  function isArr(v){return Array.isArray(v);}
  function put(id, v, allowHtml){
    var el=document.getElementById(id);
    if(!el) return;
    var s=str(v);
    if(!allowHtml || !/<[a-z]/i.test(s)) el.textContent=s;
    else el.innerHTML=s;
  }
  function items(v){
    if(!Array.isArray(v)) return [];
    var a=[];
    for(var i=0;i<v.length && i<6;i++){
      var x=v[i];
      if(x==null) continue;
      var s;
      if(typeof x==='string'||typeof x==='number'||typeof x==='boolean') s=str(x);
      else if(typeof x==='object' && !Array.isArray(x)){
        s=str(x.text!=null?x.text:(x.body!=null?x.body:(x.content!=null?x.content:x.label!=null?x.label:(x.name!=null?x.name:x.tag!=null?x.tag:x))));
      } else continue;
      if(s!=='') a.push(s);
    }
    return a;
  }
  function num(v){
    if(typeof v==='number' && isFinite(v)) return v;
    if(typeof v==='string' && v.trim()!==''){var n=parseFloat(v);if(isFinite(n)) return n;}
    return null;
  }
  var sEl=document.querySelector('script[data-card-state]');
  var S=Object.assign({}, DEFAULTS);
  if(sEl){
    try{ var u=JSON.parse(sEl.textContent); if(u && typeof u==='object' && !Array.isArray(u)) for(var k in u) S[k]=u[k]; }catch(e){}
  }
  put('h1', S.title);
  put('edTag', S.edition);
  put('edDate', S.date);
  put('kicker', S.kicker);
  put('h2', S.headline);
  put('sm', S.subtitle);
  var colsEl=document.getElementById('cols');
  if(colsEl){
    var cs;
    if(S.body && S.body.length>0){
      // 如果传入 body，使用 body
      cs=Array.isArray(S.body)?S.body.map(function(x){return typeof x==='string'?x:'';}):[S.body];
    } else {
      // 否则使用 columns
      cs=items(S.columns);
    }
    var html='';
    var escHtml=function(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    for(var i=0;i<cs.length;i++) html+='<p>'+escHtml(cs[i]).replace(/([^\n])(\n+)/g,'$1</p><p>$2').replace(/^\n+/,'').replace(/\n+$/,'')+'</p>';
    colsEl.innerHTML=html;
  }
})();
</script>
</body>
</html>
