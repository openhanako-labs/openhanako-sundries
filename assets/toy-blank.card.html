<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆润玩具开箱样张</title>
<style>
body{margin:0;background:#FFF6F1;font-family:'ZCOOL KuaiLe','YouYuan','Microsoft YaHei','PingFang SC',sans-serif;color:#33334D}
.w{max-width:520px;margin:0 auto;padding:52px 22px 24px;position:relative}
.page{background:linear-gradient(140deg,#FFE7EA 0%,#FFF3D1 45%,#DFF5F0 100%);border-radius:40px;padding:34px 30px 26px;box-shadow:0 24px 50px rgba(255,138,101,.28),0 6px 14px rgba(180,120,200,.18);position:relative;overflow:hidden}
.deco1{position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,#FFC9DB 0%,#FFC9DB 30%,transparent 31%);opacity:.7}
.deco2{position:absolute;bottom:-50px;left:-40px;width:180px;height:180px;background:radial-gradient(circle,#C8F0E8 0%,#C8F0E8 30%,transparent 31%);opacity:.8}
.badge{position:absolute;top:18px;right:22px;background:linear-gradient(135deg,#FF6F91,#FF9F1C);color:#FFF;border-radius:22px;padding:9px 18px;font-size:15px;letter-spacing:.12em;font-weight:900;box-shadow:0 5px 0 #E5573F,0 9px 20px rgba(255,111,145,.4);transform:rotate(6deg);border:3px solid #FFF}
.eyebrow{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.36em;color:#8E7BB8;margin:0 0 4px;font-weight:700}
h1{margin:0 0 12px;font-size:clamp(46px,10vw,72px);letter-spacing:.02em;line-height:1;color:#4B2FB8;font-weight:900;text-shadow:4px 4px 0 #FFC96B,7px 7px 0 rgba(75,47,184,.12)}
h1 .dot{color:#FF6F91}
.lead{font-size:15px;line-height:1.7;color:#4E4568;margin:0 0 14px}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.chip{background:#FFF;color:#4B2FB8;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:900;letter-spacing:.06em;box-shadow:0 3px 0 rgba(75,47,184,.22)}
.chip.p{background:linear-gradient(135deg,#FFC0CB,#FFA5D8)}
.chip.y{background:linear-gradient(135deg,#FFE082,#FFB84C)}
.chip.m{background:linear-gradient(135deg,#A8E6CF,#80CBC4)}
.box{background:#FFF;border-radius:24px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 0 rgba(75,47,184,.14);margin-bottom:14px}
.face{flex:0 0 auto;width:52px;height:52px;background:linear-gradient(135deg,#FFD93D,#FF9F1C);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #E07A00}
.face svg{width:34px;height:34px}
.box-body{flex:1;min-width:0}
.box-title{font-size:17px;font-weight:900;color:#4B2FB8;margin:0 0 2px}
.box-sub{font-size:12px;color:#8E7BB8;font-family:'Courier New',monospace;letter-spacing:.08em}
.open-btn{background:linear-gradient(135deg,#FF6F91,#FFB703);color:#FFF;border:3px solid #FFF;border-radius:22px;padding:11px 22px;font-family:inherit;font-size:16px;font-weight:900;letter-spacing:.06em;cursor:pointer;box-shadow:0 5px 0 #E5573F,0 10px 22px rgba(255,111,145,.45);transition:.12s}
.open-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #E5573F}
.foot{margin-top:16px;font-size:11.5px;color:#8E7BB8;text-align:right;letter-spacing:.08em;font-family:'Courier New',monospace;font-weight:700}
.cr{font-family:'Courier New',monospace;font-size:10px;color:#9A88A6;text-align:center;margin-top:16px;letter-spacing:.12em}
</style>
</head>
<body>
<div class="w">
  <div class="page">
    <div class="deco1"></div>
    <div class="deco2"></div>
    <div class="badge">NEW!</div>
    <div class="eyebrow">STYLE UNBOXING · 0-2</div>
    <h1>开箱<span class="dot">·</span>快乐</h1>
    <p class="lead">新概念科普的糖纸：把抽象的东西折进一只礼盒，让用户先笑出来，再想起来这是什么。</p>
    <div class="chips">
      <span class="chip">糖果渐变</span>
      <span class="chip p">大圆角</span>
      <span class="chip y">弹性阴影</span>
      <span class="chip m">ZCOOL KuaiLe</span>
    </div>
    <div class="box">
      <div class="face">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="11" cy="14" r="2" fill="#4B2FB8"/>
          <circle cx="21" cy="14" r="2" fill="#4B2FB8"/>
          <path d="M10 21 Q16 26 22 21" stroke="#4B2FB8" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="box-body">
        <div class="box-title">风格样张 N°01</div>
        <div class="box-sub">CONCEPT IN A BOX</div>
      </div>
      <button type="button" class="open-btn" data-action="open">开盒</button>
    </div>
    <div class="foot">P.01 · TOY · UNBOX</div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 圆润玩具开箱（风格卡 11）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":520},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"主标题"},"lead":{"type":"string","description":"导语"},"chips":{"type":"array","items":{"type":"object","properties":{"value":{"type":"string","description":"标签文字"},"variant":{"type":"string","description":"p / y / m / 空"}}},"description":"特性标签（≤6）"},"box_title":{"type":"string","description":"礼盒标题"},"box_subtitle":{"type":"string","description":"礼盒副题"},"box_btn":{"type":"string","description":"开盒按钮"},"foot":{"type":"string","description":"页脚"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "开箱·快乐",
  "lead": "拆开之前，先想清楚要什么。",
  "chips": [
    {
      "value": "糖果渐变"
    },
    {
      "value": "大圆角",
      "variant": "p"
    },
    {
      "value": "弹性阴影",
      "variant": "y"
    },
    {
      "value": "拆开之前，先想清楚要什么。",
      "variant": "m"
    }
  ],
  "box_title": "风格样张 N°01",
  "box_subtitle": "拆盲盒不如拆需求",
  "box_btn": "开盒",
  "foot": "TOY · 样品展示",
  "body": "拆开之前，先想清楚要什么。"
}
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;
  }
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);if(S.body){if(S.title)S.title=S.title+'\n'+S.body;else S.title=S.body;}

if(S.title){var e1=document.querySelector("h1");if(e1)e1.innerHTML=e(S.title,e1.innerHTML);}
if(S.lead){var e2=document.querySelector(".lead");if(e2)e2.textContent=s(S.lead,e2.textContent);}
var chips=arr(S.chips||[],6);
var chipEls=document.querySelectorAll(".chips > .chip");
for(var ci=0;ci<chipEls.length;ci++){var x=chips[ci];if(!x)continue;var ce=chipEls[ci];ce.textContent=s(x.value||x.text||x.label||"");ce.className="chip"+(x.variant?" "+x.variant:"");}
if(S.box_title){var e3=document.querySelector(".box-title");if(e3)e3.textContent=s(S.box_title,e3.textContent);}
if(S.box_subtitle){var e4=document.querySelector(".box-sub");if(e4)e4.textContent=s(S.box_subtitle,e4.textContent);}
if(S.box_btn){var e5=document.querySelector(".open-btn");if(e5)e5.textContent=s(S.box_btn,e5.textContent);}
if(S.foot){var e6=document.querySelector(".foot");if(e6)e6.textContent=s(S.foot,e6.textContent);}
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
