<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素平台样张</title>
<style>
body{margin:0;background:#5C94FC;color:#FFF;font-family:'Press Start 2P','Courier New',monospace}
.w{max-width:560px;margin:0 auto;padding:52px 14px 26px}
.hud{display:flex;justify-content:space-between;font-size:14px;letter-spacing:.1em;text-shadow:3px 3px 0 rgba(0,0,0,.5);font-weight:700;margin-bottom:14px}
.stage{position:relative;height:300px;background:linear-gradient(180deg,#5C94FC 0%,#7CA8FF 70%,#9CC0FF 100%);border:4px solid #1A1A1A;overflow:hidden}
.cloud{position:absolute;background:#FFF;box-shadow:14px 0 0 #FFF,28px 0 0 #FFF,7px -10px 0 #FFF,21px -10px 0 #FFF,35px -10px 0 #FFF;image-rendering:pixelated}
.c1{top:36px;left:40px}.c2{top:74px;right:60px}
.plat{position:absolute;background:#C84C0C;border-top:6px solid #F8B878;box-shadow:inset -6px 0 0 #8A3408,inset 6px 0 0 #A9440A}
.p1{left:34px;bottom:96px;width:130px;height:34px}
.p2{right:44px;bottom:150px;width:110px;height:34px}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:#C84C0C;border-top:8px solid #F8B878;background-image:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.28) 30px 34px),repeating-linear-gradient(0deg,transparent 0 24px,rgba(0,0,0,.28) 24px 28px)}
.coin{position:absolute;width:22px;height:26px;background:#FFD23F;border:3px solid #B8860B;border-radius:50%/40%;box-shadow:2px 2px 0 rgba(0,0,0,.4);animation:spin 1.1s steps(2) infinite}
.coin::after{content:"";position:absolute;left:6px;top:4px;width:4px;height:14px;background:#FFF6C2}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
.co1{left:88px;bottom:140px}.co2{left:126px;bottom:140px}.co3{right:84px;bottom:194px}
.hero{position:absolute;left:56px;bottom:130px;width:34px;height:44px;animation:hop 1.6s ease-in-out infinite}
.hero i{position:absolute;display:block}
.hd1{left:6px;top:0;width:22px;height:16px;background:#E44C0C;box-shadow:-6px 6px 0 #E44C0C,6px 6px 0 #E44C0C}
.hd2{left:4px;top:14px;width:26px;height:14px;background:#FFC8A0}
.bd{left:2px;top:26px;width:30px;height:14px;background:#2A5CD8}
.eg{left:4px;top:40px;width:10px;height:4px;background:#1A1A1A;box-shadow:16px 0 0 #1A1A1A}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px)}60%{transform:translateY(-26px)}}
.flag{position:absolute;right:70px;bottom:56px;width:6px;height:180px;background:#9A9A9A}
.flag i{position:absolute;top:0;left:6px;width:44px;height:26px;background:#3FBF4A;clip-path:polygon(0 0,100% 25%,0 50%)}
.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#FFD23F;text-shadow:2px 2px 0 rgba(0,0,0,.5);letter-spacing:.1em}
.cr{text-align:center;font-size:10px;color:rgba(255,255,255,.8);margin-top:16px;letter-spacing:.1em;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="w">
  <div class="hud"><span>STYLES ×26</span><span>WORLD 2-7</span><span>TIME ∞</span></div>
  <div class="stage">
    <div class="score">PRESS SPIN — 0 errors</div>
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="coin co1"></div><div class="coin co2"></div><div class="coin co3"></div>
    <div class="plat p1"></div><div class="plat p2"></div>
    <div class="flag"><i></i></div>
    <div class="hero"><i class="hd1"></i><i class="hd2"></i><i class="bd"></i><i class="eg"></i></div>
    <div class="ground"></div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 像素平台跳跃（风格卡 2-7）</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":560},"stateSchema":{"type":"object","properties":{"hud_styles":{"type":"string","description":"HUD 样式计数"},"hud_world":{"type":"string","description":"HUD 世界编号"},"hud_time":{"type":"string","description":"HUD 时间"},"score":{"type":"string","description":"HUD 得分/错误"},"title":{"type":"string","description":"主标题（必填）"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "hud_styles": "STYLES ×26",
  "hud_world": "WORLD 2-7",
  "hud_time": "TIME ∞",
  "score": "SCORE 9000",
  "title": "pixel-platform",
  "body": "8-bit 的世界，坐标是唯一的语法。"
}
</script>
<script id="__card_render__">
(function(){
  function readState(){var d=null;try{var s=document.querySelector('script[data-card-state]');if(s)d=JSON.parse(s.textContent);}catch(e){}return d;
  }
  function s(v,d){if(v===undefined||v===null)return d;if(typeof v==="string"){v=v.trim();return v===''?d:v;}return String(v);}
  function arr(v,n){if(!Array.isArray(v))return [];var o=[];for(var i=0;i<v.length&&o.length<n;i++){var x=v[i];if(x&&typeof x==="object"&&!Array.isArray(x))o.push(x);}return o;}
  function e(v,d){var x=s(v,d);if(x===d)return d;return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  var S=readState(); if(!S)return; try{
    var DEFAULTS={title:'',body:''};
    S=Object.assign({},DEFAULTS,S);if(S.body){if(S.title)S.title=S.title+'\n'+S.body;else S.title=S.body;}

var spans=document.querySelectorAll(".hud > span");
if(spans[0]&&S.hud_styles)spans[0].textContent=s(S.hud_styles,spans[0].textContent);
if(spans[1]&&S.hud_world)spans[1].textContent=s(S.hud_world,spans[1].textContent);
if(spans[2]&&S.hud_time)spans[2].textContent=s(S.hud_time,spans[2].textContent);
var sEl=document.querySelector(".score");if(sEl)sEl.textContent=s((S.score&&S.score.length>0?S.score:(S.title||S.body||'')),sEl.textContent);
var bodyBox=document.createElement('div');bodyBox.style.cssText='padding:10px 12px 2px;font-size:11px;line-height:1.7;color:#FFF;text-shadow:2px 2px 0 rgba(0,0,0,.5);letter-spacing:.04em;font-family:"Courier New",monospace';var paras=[];if(Array.isArray(S.body)){paras=S.body.map(function(x){return String(x).trim();}).filter(Boolean);}else{paras=String(S.body||'').split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean);}bodyBox.innerHTML=paras.map(function(t){return '<p style="margin:0 0 5px">'+String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>';}).join('');var w2=document.querySelector('.w');if(w2){var cr=w2.querySelector('.cr');if(cr)w2.insertBefore(bodyBox,cr);else w2.appendChild(bodyBox);}
}catch(err){console.error("[card] render error:",err);} })();
</script>
</body>
</html>
