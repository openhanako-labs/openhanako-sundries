<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海洋蓝绿样张</title>
<style>
body{margin:0;background:#EAF6F5;color:#14555B;font-family:'Segoe UI','Noto Sans SC',sans-serif}
.c{max-width:600px;margin:0 auto;padding:56px 20px 28px;position:relative;overflow:hidden}
.wave{position:absolute;left:0;right:0;bottom:0;pointer-events:none;opacity:.5}
.lb{font-size:11px;letter-spacing:.3em;color:#3E9A94;font-weight:700}
.h{font-size:clamp(34px,8vw,50px);font-weight:800;letter-spacing:.02em;margin:14px 0 8px;color:#0E7C7B}
.sub{font-size:14px;color:#4A8A87;letter-spacing:.06em}
.rows{margin-top:26px;display:flex;flex-direction:column;gap:10px;position:relative}
.r{display:flex;justify-content:space-between;align-items:center;background:#FFFFFF;border:1px solid #CBE7E4;border-radius:8px;padding:12px 16px;font-size:13.5px;color:#2A6E6C}
.r b{font-family:Consolas,monospace;color:#0E7C7B}
.sw{display:flex;gap:10px;margin-top:22px;position:relative}
.sw i{width:38px;height:38px;border-radius:8px;border:1px solid rgba(14,124,123,.25)}
.cr{font-family:Consolas,monospace;font-size:10px;color:#7FB5B0;text-align:center;margin-top:34px;letter-spacing:.12em;position:relative}
</style>
</head>
<body>
<div class="c">
  <svg class="wave" viewBox="0 0 600 90" preserveAspectRatio="none" role="img"><title>海浪装饰</title><path d="M0 50 Q 75 22 150 50 T 300 50 T 450 50 T 600 50 L600 90 L0 90 Z" fill="#D6EFEC"/><path d="M0 66 Q 75 42 150 66 T 300 66 T 450 66 T 600 66 L600 90 L0 90 Z" fill="#BFE6E2"/></svg>
  <div class="lb">STYLE // OCEAN</div>
  <div class="h" id="title"></div>
  <div class="sub" id="subtitle"></div>
  <div class="rows">
    <div class="r"><span>ground</span><b>#EAF6F5</b></div>
    <div class="r"><span>primary</span><b>#0E7C7B</b></div>
    <div class="r"><span>line</span><b>#CBE7E4</b></div>
  </div>
  <div class="sw"><i style="background:#0E7C7B"></i><i style="background:#2AA5A0"></i><i style="background:#7FC9C4"></i><i style="background:#D6EFEC"></i></div>
  <div class="cr">风格指令 · design-media · SVG 风格表 ocean</div>
</div>
<script type="application/json" data-card-manifest>{"spec":"1.0","display":{"preferredWidthPx":600},"stateSchema":{"type":"object","properties":{"title":{"type":"string","description":"色卡主标题"},"subtitle":{"type":"string","description":"一句话风格说明"},"body":{"description":"正文（必填）。字符串用 \\n\\n 分段，或传字符串数组","oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}},"required":["title","body"]}}</script>
<script type="application/json" data-card-state>
{
  "title": "海洋蓝绿",
  "subtitle": "深海蓝 · 越暗越要留白",
  "body": "深海蓝 · 越暗越要留白"
}
</script>
<script>
(function(){
var D={title:'Sample Title',subtitle:'Sample subtitle'};
function str(v){if(v==null)return'';if(typeof v==='string')return v;if(typeof v==='number'||typeof v==='boolean')return String(v);if(Array.isArray(v))return v.map(str).filter(Boolean).join(' ');return'';}
function pick(o){if(!o||typeof o!=='object'||Array.isArray(o))return null;var a=arguments;for(var i=1;i<a.length;i++){var k=a[i];if(Object.prototype.hasOwnProperty.call(o,k)&&str(o[k])!=='')return o[k];}return null;}
function put(id,v){var el=document.getElementById(id);if(el)el.textContent=str(v);}
var sEl=document.querySelector('script[data-card-state]');
var S=Object.assign({},D);
if(sEl){try{var u=JSON.parse(sEl.textContent);if(u&&typeof u==='object'&&!Array.isArray(u))for(var k in u)S[k]=u[k];}catch(e){}}
put('title',pick(S,'title','heading'));
put('subtitle',pick(S,'body','subtitle','desc'));
})();
</script>
</body>
</html>
