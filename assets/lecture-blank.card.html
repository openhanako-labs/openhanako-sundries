<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简讲义样张</title>
<style>
body{margin:0;background:#FCFCFA;color:#1A1A1A;font-family:'Noto Serif SC','Songti SC','SimSun',serif}
.w{max-width:520px;margin:0 auto;padding:56px 26px 24px}
.paper{border-top:1.5px solid #1A1A1A;border-bottom:1.5px solid #1A1A1A;padding:26px 4px 26px}
.rule-top{display:flex;justify-content:space-between;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.34em;color:#1A1A1A;border-bottom:1px solid #1A1A1A;padding-bottom:8px;margin-bottom:32px}
.rule-top .l{font-weight:700}
.rule-top .r{font-weight:700}
h1{font-size:46px;line-height:1.15;letter-spacing:.04em;font-weight:400;margin:0 0 8px}
h1 em{font-style:italic;color:#B03024;font-weight:400}
h1 .big{font-size:96px;float:left;line-height:.85;margin:6px 20px 0 -6px;font-weight:400;color:#1A1A1A}
.sub{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.32em;color:#888;margin:0 0 32px;text-transform:uppercase}
.defbox{border-left:2px solid #1A1A1A;padding:6px 0 6px 18px;margin:0 0 24px}
.defbox h2{font-size:15px;font-weight:700;margin:0 0 6px;letter-spacing:.06em}
.defbox p{font-size:13.5px;line-height:1.9;margin:0 0 4px;color:#2A2A2A}
.eq{font-family:'Courier New',monospace;font-size:14px;letter-spacing:.06em;color:#1A1A1A;margin:6px 0 0}
.body{column-count:2;column-gap:26px;column-rule:1px solid #DDD;font-size:12.5px;line-height:1.9;color:#3A3A3A;text-align:justify;margin:0 0 24px}
.body p{margin:0 0 10px}
.body p:first-child::first-letter{font-size:2.4em;float:left;line-height:.9;padding:2px 6px 0 0;font-weight:700;color:#B03024;font-style:italic}
.notes{display:flex;gap:22px;font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.16em;color:#666;border-top:1px solid #1A1A1A;padding-top:10px}
.notes div{flex:1}
.notes b{color:#1A1A1A;font-weight:700;letter-spacing:.24em;display:block;margin-bottom:2px}
.cr{font-family:'Courier New',monospace;font-size:10px;color:#888;text-align:center;margin-top:18px;letter-spacing:.14em}
</style>
</head>
<body>
<div class="w">
  <div class="paper">
    <div class="rule-top">
      <span class="l" id="tagL"></span>
      <span class="r" id="tagR"></span>
    </div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="defbox">
      <h2 id="defTitle"></h2>
      <p id="defBody"></p>
      <p class="eq" id="eq"></p>
    </div>
    <div class="body" id="body"></div>
    <div class="notes">
      <div><b>§ 1-1</b><span id="note1"></span></div>
      <div><b>NOTE</b><span id="note2"></span></div>
      <div><b>SERIF</b><span id="note3"></span></div>
    </div>
  </div>
  <div class="cr">风格指令 · video-shot-demos · 极简讲义（风格卡 13）</div>
</div>
<script type="application/json" data-card-manifest>
{"spec":"1.0","display":{"preferredWidthPx":520},"stateSchema":{"type":"object","properties":{"tagLeft":{"type":"string"},"tagRight":{"type":"string"},"title":{"type":"string","description":"可含 <em></em> 与 <br>"},"subtitle":{"type":"string"},"definition":{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"},"equation":{"type":"string"}}},"body":{"type":"array","items":{"type":"string"}},"notes":{"type":"array","items":{"type":"string"},"description":"三格 notes"}}}}
</script>
<script type="application/json" data-card-state>
{
  "tagLeft": "要点",
  "tagRight": "要点",
  "title": "定义、要点、易错点。先讲清是什么，再讲为什么。",
  "subtitle": "定义、要点、易错点。先讲清是什么，再讲为什么。",
  "definition": {
    "title": "定义",
    "body": "要点",
    "equation": "定义、要点、易错点。先讲清是什么，再讲为什么。"
  },
  "body": [
    "定义、要点、易错点。先讲清是什么，再讲为什么。",
    "定义、要点、易错点。先讲清是什么，再讲为什么。"
  ],
  "notes": [
    "要点",
    "大留白 · 细线框",
    "要点"
  ]
}
</script>
<script>
(function(){
  var DEFAULTS={tagLeft:'LECTURE · 1-1',tagRight:'CH. 01 · Title',title:'标题',subtitle:'Subtitle',definition:{title:'定义',body:'正文。',equation:'Eq'},body:['正文段落。'],notes:['NOTE 1','NOTE 2','NOTE 3']};
  function str(v){
    if(v==null) return '';
    if(typeof v==='string') return v;
    if(typeof v==='number'||typeof v==='boolean') return String(v);
    if(Array.isArray(v)) return v.map(str).filter(Boolean).join(' ');
    return '';
  }
  function put(id, v, allowHtml){
    var el=document.getElementById(id);
    if(!el) return;
    var s=str(v);
    if(!allowHtml || !/<[a-z]/i.test(s)) el.textContent=s;
    else el.innerHTML=s;
  }
  function items(v, max){
    if(!Array.isArray(v)) return [];
    var a=[];
    var cap=max||6;
    for(var i=0;i<v.length && i<cap;i++){
      var x=v[i];
      if(x==null) continue;
      var s;
      if(typeof x==='string'||typeof x==='number'||typeof x==='boolean') s=str(x);
      else if(typeof x==='object' && !Array.isArray(x)){
        s=str(x.text!=null?x.text:(x.body!=null?x.body:(x.content!=null?x.content:(x.label!=null?x.label:(x.name!=null?x.name:'')))));
      } else continue;
      if(s!=='') a.push(s);
    }
    return a;
  }
  var sEl=document.querySelector('script[data-card-state]');
  var S=Object.assign({}, DEFAULTS);
  if(sEl){
    try{
      var u=JSON.parse(sEl.textContent);
      if(u && typeof u==='object' && !Array.isArray(u)){
        for(var k in u) S[k]=u[k];
        if(u.definition && typeof u.definition==='object') S.definition=Object.assign({}, DEFAULTS.definition, u.definition);
      }
    }catch(e){}
  }
  put('tagL', S.tagLeft);
  put('tagR', S.tagRight);
  put('h1', S.title, true);
  put('sub', S.body||S.subtitle);
  put('defTitle', S.definition.title);
  put('defBody', S.definition.body);
  put('eq', S.definition.equation);
  var bEl=document.getElementById('body');
  if(bEl){
    var ps=items(S.body, 4);
    var html='';
    for(var i=0;i<ps.length;i++) html+='<p>'+ps[i].replace(/([^\n])(\n+)/g,'$1</p><p>$2').replace(/^\n+/,'').replace(/\n+$/,'')+'</p>';
    bEl.innerHTML=html;
  }
  var ns=items(S.notes, 3);
  put('note1', ns[0]||'');
  put('note2', ns[1]||'');
  put('note3', ns[2]||'');
})();
</script>
</body>
</html>
